---
name: github-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/fabric_etl/**'
      - 'pyproject.toml'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; queued runs wait instead of cancelling a
# deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # mkdocstrings imports fabric_etl, so the site builds from the
      # project env (zensical pinned in the site group), not uvx.
      - name: Sync site environment
        run: uv sync --group site

      - name: Generate schema docs
        run: uv run fabric-etl docs --registry fabric_etl.load.control --out docs/schema

      - name: Build site
        run: uv run zensical build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
