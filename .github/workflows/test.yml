name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync dev environment
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Schema docs drift
        run: uv run fabric-etl docs --registry fabric_etl.load.control --out docs/schema --check

      - name: Build site
        run: |
          uv sync --group site
          uv run zensical build
