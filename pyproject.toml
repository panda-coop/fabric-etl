[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-etl"
version = "0.1.0"
description = "Schema-as-code for Microsoft Fabric: entities, mappings, DDL, docs, typed I/O"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Panda Coop" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
sql = ["pyodbc>=5"]
cdc = ["pyodbc>=5"]
xml = ["lxml>=5"]
http = ["httpx>=0.27"]
spark = ["pyspark>=3.5"]
docs = ["griffe>=1.0"]
settings = ["pydantic-settings>=2.6"]
azure = ["pydantic-settings[azure-key-vault]>=2.6"]

[project.scripts]
fabric-etl = "fabric_etl.cli:main"

[project.urls]
Homepage = "https://github.com/panda-coop/fabric-etl"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "respx>=0.21",
    "lxml>=5",
    "pydantic-settings>=2.6",
    "griffe>=1.0",
]
site = [
    "zensical>=0.0.64",
    "mkdocstrings-python>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_etl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
