[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-etl"
version = "0.0.1"
description = "ETL tooling for Microsoft Fabric"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [{ name = "Panda Coop" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.urls]
Homepage = "https://github.com/panda-coop/fabric-etl"
