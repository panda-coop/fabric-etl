site_name: fabric-etl
site_url: https://panda-coop.github.io/fabric-etl/
repo_url: https://github.com/panda-coop/fabric-etl

theme:
  variant: classic
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - tables

nav:
  - Home: index.md
  - Guide:
      - Entities: guide/entities.md
      - Transform: guide/transform.md
      - Extract: guide/extract.md
      - Load: guide/load.md
      - CLI: guide/cli.md
