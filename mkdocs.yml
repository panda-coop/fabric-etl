site_name: fabric-etl
site_url: https://panda-coop.github.io/fabric-etl/
site_description: Schema-as-code for Microsoft Fabric
repo_url: https://github.com/panda-coop/fabric-etl
repo_name: panda-coop/fabric-etl
copyright: Copyright &copy; 2026 PANDA Coop

extra_css:
  - stylesheets/extra.css

theme:
  variant: classic
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.details
  - tables

nav:
  - Home: index.md
  - Guide:
      - Entities: guide/entities.md
      - Transform: guide/transform.md
      - Extract: guide/extract.md
      - Load: guide/load.md
      - CLI: guide/cli.md
  - Schema:
      - Entities: schema/index.md
      - control.run_log: schema/control/run_log.md
      - control.watermark: schema/control/watermark.md
  - API:
      - entities: reference/entities.md
      - transform: reference/transform.md
      - extract: reference/extract.md
      - load: reference/load.md
      - settings: reference/settings.md
